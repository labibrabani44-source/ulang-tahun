<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Ulang Tahun, Syifa!</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(to right, #ff9a9e, #fad0c4);
        overflow: hidden;
        text-align: center;
    }
    .card {
        position: relative;
        z-index: 10;
        background-color: rgba(255, 255, 255, 0.9);
        padding: 30px 40px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        max-width: 500px;
        margin: 50px auto;
    }
    .slideshow {
        position: relative;
        height: 220px;
        margin-bottom: 20px;
    }
    .slide {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 20px;
        border: 4px solid #ff4d6d;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        transition: opacity 1s ease-in-out;
    }
    h1 {
        color: #ff4d6d;
        font-size: 2.5em;
        margin-bottom: 10px;
    }
    p {
        color: #333;
        font-size: 1.2em;
        line-height: 1.5;
    }
    .heart {
        color: #ff4d6d;
        font-size: 2em;
        animation: beat 1s infinite;
    }
    @keyframes beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }
    .button {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 1em;
        color: white;
        background-color: #ff4d6d;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.3s;
        text-decoration: none;
    }
    .button:hover {
        background-color: #ff1a4d;
    }
    .balloon {
        position: absolute;
        width: 50px;
        height: 70px;
        border-radius: 50%;
        animation: float 6s linear infinite;
    }
    @keyframes float {
        0% { transform: translateY(100vh) rotate(0deg); }
        100% { transform: translateY(-100vh) rotate(360deg); }
    }
    .firework {
        position: absolute;
        width: 5px;
        height: 5px;
        background: yellow;
        border-radius: 50%;
        box-shadow: 0 0 10px 2px yellow;
        animation: explode 1s ease-out forwards;
    }
    @keyframes explode {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(5); opacity: 0; }
    }
</style>
</head>
<body>
    <div class="card">
        <div class="slideshow">
            <img src="foto1.jpg" alt="Syifa Foto 1" class="slide" style="opacity:1;">
            <img src="foto2.jpg" alt="Syifa Foto 2" class="slide" style="opacity:0;">
            <img src="foto3.jpg" alt="Syifa Foto 3" class="slide" style="opacity:0;">
            <img src="foto4.jpg" alt="Syifa Foto 4" class="slide" style="opacity:0;">
            <img src="foto5.jpg" alt="Syifa Foto 5" class="slide" style="opacity:0;">
        </div>
        <h1>Selamat Ulang Tahun, Syifa! <span class="heart">❤️</span></h1>
        <p>
            Happy 22th Birthday, Syifa! Semoga hari ini spesial untukmu, penuh tawa, cinta, dan kebahagiaan. 
            Aku sangat bersyukur memilikimu di hidupku. Teruslah bersinar dan menjadi dirimu yang luar biasa!
        </p>
        <a href="#" class="button">Peluk Virtual 🤗</a>
    </div>

    <audio autoplay>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Slideshow
        let slides = document.querySelectorAll('.slide');
        let current = 0;
        function showNextSlide() {
            slides[current].style.opacity = 0;
            current = (current + 1) % slides.length;
            slides[current].style.opacity = 1;
        }
        setInterval(showNextSlide, 3000);

        // Balon
        function createBalloon() {
            let balloon = document.createElement('div');
            balloon.classList.add('balloon');
            balloon.style.backgroundColor = `hsl(${Math.random()*360}, 70%, 60%)`;
            balloon.style.left = `${Math.random()*100}vw`;
            balloon.style.animationDuration = `${4 + Math.random()*4}s`;
            document.body.appendChild(balloon);
            setTimeout(() => balloon.remove(), 8000);
        }
        setInterval(createBalloon, 500);

        // Kembang api
        function createFirework() {
            let firework = document.createElement('div');
            firework.classList.add('firework');
            firework.style.left = `${Math.random()*100}vw`;
            firework.style.top = `${Math.random()*50}vh`;
            document.body.appendChild(firework);
            setTimeout(() => firework.remove(), 1000);
        }
        setInterval(createFirework, 700);
    </script>
</body>
</html>
